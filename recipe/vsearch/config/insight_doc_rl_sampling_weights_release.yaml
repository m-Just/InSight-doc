# Sampling weights used for the released InSight-Doc RL run.
#
# The RL parquet has simplified data_source keys. The sampler draws a source
# according to these probabilities, samples without replacement within that
# source, and reshuffles/refills that source when it exhausts.
#
# High-level design:
# - 86% answerable and 14% unanswerable sampling mass.
# - 5% total mass for the arXiv structural add-on rows.
# - 5% total mass for multiple-choice false-e calibration rows.
