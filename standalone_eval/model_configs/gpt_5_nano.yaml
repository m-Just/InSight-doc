model: gpt-5-nano
backend: https_openai_chat

generation:
  max_tokens_after_initial_prompt: 16384

https_openai_chat:
  # Null means the standalone HTTPS rollout path reads OPENAI_BASE_URL at runtime.
  base_url: null
  api_key_env: OPENAI_API_KEY
  timeout: 3600
  max_retries: default
  image_format: png
  image_detail: high
  reasoning_effort: high
