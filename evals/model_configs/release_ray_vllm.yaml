# Generic release config for local HF checkpoints served through Ray/vLLM.
# Set MODEL_PATH to the HF model directory before launching evaluation.
model: ${oc.env:MODEL_PATH}
backend: ray_vllm

generation:
  max_tokens_after_initial_prompt: 16384

ray_vllm:
  num_replicas: ${oc.env:VLLM_NUM_REPLICAS,4}
  gpus_per_replica: ${oc.env:VLLM_GPUS_PER_REPLICA,1}
  max_model_len: ${oc.env:VLLM_MAX_MODEL_LEN,262144}
  max_num_seqs: ${oc.env:VLLM_MAX_NUM_SEQS,64}
  max_num_batched_tokens: ${oc.env:VLLM_MAX_NUM_BATCHED_TOKENS,32768}
  gpu_memory_utilization: ${oc.env:VLLM_GPU_MEMORY_UTILIZATION,0.8}
  enable_prefix_caching: true
  enable_chunked_prefill: true
  enforce_eager: true
  trust_remote_code: false
  prompt_length_estimator: tokenized
  require_prompt_length_estimator: false
  prompt_length_safety_margin: 0
  sampling:
    temperature: ${oc.env:SAMPLING_TEMPERATURE,0.7}
    top_p: ${oc.env:SAMPLING_TOP_P,0.8}
    top_k: ${oc.env:SAMPLING_TOP_K,20}
    presence_penalty: ${oc.env:SAMPLING_PRESENCE_PENALTY,1.5}
    repetition_penalty: ${oc.env:SAMPLING_REPETITION_PENALTY,1.0}
