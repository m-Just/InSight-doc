[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-doc"
version = "0.1.0"
description = "InSight-doc training, evaluation, and agentic document-understanding utilities"
readme = "README.md"
requires-python = ">=3.10,<3.13"
keywords = [
    "document-understanding",
    "vision-language-models",
    "agentic-ai",
    "qwen3-vl",
    "verl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.5.0",
    "flash-attn>=2.8.3",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.0",
    "hydra-core>=1.3.2",
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26,<3",
    "omegaconf>=2.3.0",
    "openai>=2.15.0",
    "packaging>=25.0",
    "pandas>=2.3.0",
    "peft>=0.18.0",
    "pillow>=10.0.0",
    "pre-commit>=3.0.0",
    "pyarrow>=19.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
    "qwen-agent>=0.0.31",
    "qwen-vl-utils>=0.0.14",
    "ray[default]>=2.53.0",
    "regex>=2024.0.0",
    "ruff>=0.8.0",
    "safetensors>=0.7.0",
    "seaborn>=0.13.0",
    "tensorboard>=2.20.0",
    "tensordict>=0.10.0",
    "torch>=2.9.0",
    "torchdata>=0.11.0",
    "tqdm>=4.67.0",
    "transformers>=4.57.0",
    "vllm>=0.14.0rc2",
    "wandb>=0.28.0",
]

[project.urls]
Homepage = "https://example.com/insight-doc-project"
Repository = "https://github.com/m-Just/InSight-doc"
Paper = "https://example.com/insight-doc-paper"

[project.scripts]
insight-doc-rollout = "evals.rollout:main"
insight-doc-judge = "evals.judge:main"
insight-doc-eval-sweep = "scripts.eval_sweep:main"
insight-doc-serve-ray-vllm = "scripts.serve_ray_vllm:main"
insight-doc-stop-ray-vllm = "scripts.stop_ray_vllm:main"
insight-doc-convert-sft = "scripts.convert_exported_convos_to_qwen3_vl_zoom_in_sft:main"
insight-doc-eval-sft-quality = "scripts.evaluate_sft_trajectory_quality:main"
insight-doc-eval-export-quality = "scripts.evaluate_exported_conversation_trajectory_quality:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["insight_agent_core*", "evals*", "scripts*"]

[tool.setuptools.package-data]
insight_agent_core = ["configs/*.yaml"]
evals = ["agent_configs/*.yaml", "model_configs/*.yaml", "*.md"]
